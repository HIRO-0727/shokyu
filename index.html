<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑石きたむら動物病院</title>
    <meta name="description" content="滑石きたむら動物病院の公式サイトです。">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <meta name="robots" content="noindex">

</head>
<body>
    <div id="container">
        <!-- ヘッダー -->
        <header class="header">
            <div class="inner">
                <h1 class="header__logo">
                    <a href="#" class="header__link">
                        <img src="./img/asiato-logo.png" alt="logo" class="logo__image">
                        滑石きたむら動物病院
                    </a>
                </h1>
                <nav class="header__nav pc">
                    <ul>
                        <li>
                            <a href="#aisatsu">ご挨拶</a>
                        </li>
                        <li>
                            <a href="#tsuyomi">強み</a>
                        </li>
                        <li>
                            <a href="#service">サービス</a>
                        </li>
                        <li>
                            <a href="#oshirase">お知らせ</a>
                        </li>
                        <li>
                            <a href="#access">アクセス</a>
                        </li>
                        <li>
                            <a href="#toiawase">お問い合わせ</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>
        <!-- メイン -->
        <main class="main">
            <!-- mv -->
            <div class="mv">
                <div class="mv__image">
                    <picture>
                        <source media="(min-width: 768px)" srcset="./img/fv-pc.jpg">
                        <img src="./img/fv-sp.jpg" alt="大切な家族のホームドクター">
                    </picture>
                </div>
                <div class="mv__contents">
                    <div class="mv__catch">
                        <p>滑石きたむら動物病院は</p>
                        <h2>大切な家族の<br>ホームドクターです</h2>
                    </div>
                </div>
            </div>
            <section id="goaisatsu" class="goaisatsu">
                <div class="inner">
                    <div class="goaisatsu__title">
                        <h2>動物たちの健康で幸せな生活をサポート</h2>
                    </div>
                    <div class="goaisatsu__contents">
                        <p>
                            当院は地域に密着し、皆さまの大切な家族の一員である動物たちのホームドクターを<span>目指しています。</span><br>
                            緊急時だけではなく、日常のちょっとした不安や違和感などお気軽にご相談ください。<br>
                            動物たちが健康で幸せな生活を送ることができるようサポートいたします。
                        </p>
                    </div>
                </div>
                <div class="asiato__image">
                    <img src="./img/asiato2.svg" alt="足跡">
                </div>
            </section>
        </main>
        <div class="footer footer"></div>
    </div>
</body>
</html>
